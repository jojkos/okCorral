<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OK Corral share card</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Rye&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #142832; font-family: 'Outfit', sans-serif; color: #f5ead6; }
      .card { position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate; background: radial-gradient(ellipse at 20% 85%, #2b676b88, transparent 55%), radial-gradient(ellipse at 90% 85%, #a4593980, transparent 55%), linear-gradient(160deg, #142832, #23343a 55%, #2b242a); }
      .card::before { content: ''; position: absolute; inset: 16px; border: 1px solid #eac08255; border-radius: 12px; z-index: -1; }
      .landscape { position: absolute; inset: auto 0 0; height: 280px; background: url('/frontier.svg') center bottom / cover; opacity: .13; z-index: -1; }
      .eyebrow { margin: 0; padding-top: 45px; text-align: center; color: #eac082; font: 700 16px 'Space Mono', monospace; letter-spacing: 5px; }
      h1 { margin: 20px 0 0; text-align: center; font: 104px/1.1 'Rye', Georgia, serif; color: #eac082; text-shadow: 0 6px 0 #0b1b25; }
      .sheriff, .outlaw { position: absolute; top: 166px; filter: drop-shadow(0 14px 12px #07171d66); }
      .sheriff { left: 37px; }
      .outlaw { right: 37px; }
      .copy { position: absolute; left: 330px; right: 330px; top: 270px; text-align: center; }
      .copy p { margin: 0; font-size: 36px; font-weight: 600; line-height: 1.25; }
      .copy p + p { margin-top: 13px; color: #eac082; font-size: 28px; font-weight: 500; }
      .how { position: absolute; top: 480px; left: 340px; right: 340px; text-align: center; color: #d2d8cc; font-size: 17px; line-height: 1.5; }
      .how strong { color: #f5ead6; font-weight: 600; }
      .side { position: absolute; bottom: 37px; width: 300px; text-align: center; font: 700 16px 'Space Mono', monospace; letter-spacing: 4px; }
      .side.left { left: 50px; color: #9dd9d4; }
      .side.right { right: 50px; color: #f0ae90; }
      .site { position: absolute; bottom: 37px; left: 380px; right: 380px; text-align: center; font: 13px 'Space Mono', monospace; color: #d2d8cc; }
    </style>
  </head>
  <body>
    <div id="root">Loading artwork…</div>
    <script type="module" src="/art/social-preview.tsx"></script>
  </body>
</html>
